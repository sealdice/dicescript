name: Build Js Port

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.21.13'

    - name: Install gopherjs
      run: |
        go install github.com/gopherjs/gopherjs@v1.21.0
        go mod download

    - name: Build
      run: gopherjs build -m -o jsport/dicescript.cjs github.com/sealdice/dicescript/jsport

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Bundle ESM
      run: cd ./jsport && pnpm install && pnpm build

    - name: Deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.MY_TOKEN }}
        publish_dir: ./jsport
        exclude_assets: './node_modules,./dicescript.cjs,./dicescript.cjs.map'
        force_orphan: true
